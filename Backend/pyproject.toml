[project]
name = "kitchenelite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=4.5.0",
    "django>=5.2.10",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "huggingface>=0.0.1",
    "langchain>=1.2.7",
    "langchain-classic>=1.0.1",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.1",
    "langchain-mistralai>=1.1.1",
    "langchain-pinecone>=0.2.13",
    "langchainhub>=0.1.21",
    "mistralai>=1.10.1",
    "pillow>=12.1.0",
    "pypdf>=6.6.2",
    "sentence-transformers>=5.2.2",
    "uvicorn>=0.40.0",
    "torch", # Add these three explicitly to the dependencies list
    "torchvision",
    "torchaudio",
    "gunicorn>=21.2.0",
    "faiss-cpu>=1.13.2",
    "ipykernel>=7.2.0",
    "wikipedia>=1.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
# Note the square brackets [ ] around the source definitions
torch = [ { index = "pytorch-cu121" } ]
torchvision = [ { index = "pytorch-cu121" } ]
torchaudio = [ { index = "pytorch-cu121" } ]
